name: Build Wails App

on:
  push:
    branches: [ main ]
    tags:
      - v*.*.*
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_CACHE_VERBOSITY: detailed
  APP_NAME: zentao-max
  # 不要 GOPRIVATE: go.mod 里的所有依赖 (含 github.com/yi-nology/common) 都是 public
  # 强制走 git 反而让 GITHUB_TOKEN 没权限的 repo (common) 拉不到
  # public repo 让 Go 走 proxy.golang.org 就好, 私有模块 (zentao-max 自身) 靠 git extraheader bearer 兜底

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            artifact_suffix: linux-amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            artifact_suffix: linux-arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            artifact_suffix: windows-amd64
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            artifact_suffix: darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 显式开启: 把 GITHUB_TOKEN 写到 .git/config, 让后续 git 命令可鉴权
          persist-credentials: true

      - name: Configure git for private Go modules
        # GOPRIVATE 让 Go 跳过 proxy 直走 git, 但 git ls-remote 仍要凭证
        # 用 bearer extraheader (跟 actions/checkout 内部一致), 走 modern auth,
        # 不要把 token 塞 URL 里 -- GitHub 已禁 basic auth
        run: |
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: bearer ${GITHUB_TOKEN}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        shell: bash
        run: |
          set -e
          npm run build

      - name: Copy static assets
        shell: bash
        run: ./scripts/copy-static.sh

      - name: Build web binary (embedded frontend)
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -e
          mkdir -p bin
          # 纯 Go（hertz + modernc sqlite），CGO_ENABLED=0 交叉编译
          # 产出单 binary：HTTP server + 嵌入式前端（web 应用模式）
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w"             -o "bin/zentao-max${{ matrix.goos == 'windows' && '.exe' || '' }}"             ./backend/cmd/app

      - name: List build outputs
        shell: bash
        run: |
          echo "== bin/ =="
          ls -lah bin/ 2>/dev/null || true

      - name: Package Linux tar.gz
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -e
          cd bin

          BIN_NAME="${{ env.APP_NAME }}"
          if [ ! -f "$BIN_NAME" ]; then
            echo "Binary not found: $BIN_NAME"
            ls -lah
            exit 1
          fi

          tar -czf "${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.tar.gz" "$BIN_NAME"

      - name: Package macOS zip
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -e
          cd bin

          APP_BUNDLE="${{ env.APP_NAME }}.app"
          ZIP_NAME="${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.zip"

          # 优先打包 .app bundle（如果 wails3 task package 跑过），否则裸 binary
          if [ -d "$APP_BUNDLE" ]; then
            echo "Found .app bundle, creating proper macOS package"
            ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$ZIP_NAME"
          elif [ -f "${{ env.APP_NAME }}" ]; then
            echo "No .app bundle, zipping raw binary"
            zip "$ZIP_NAME" "${{ env.APP_NAME }}"
          else
            echo "Neither .app nor raw binary found"
            ls -lah
            exit 1
          fi

          cat > "README-macOS-${{ matrix.goarch }}.txt" <<EOF
          ${{ env.APP_NAME }} macOS 安装说明

          如果是 .app bundle:
          1. 解压 ${ZIP_NAME}
          2. 将 "${{ env.APP_NAME }}.app" 拖到 Applications
          3. 首次运行时若被拦截，先右键 -> 打开
          4. 若仍无法打开，请执行：
             xattr -r -d com.apple.quarantine /Applications/${{ env.APP_NAME }}.app

          如果是裸 binary:
          1. 解压 ${ZIP_NAME}
          2. chmod +x zentao-max
          3. ./zentao-max

          说明：
          - 当前产物未做 Apple Developer 签名与 notarization
          - 面向正式外部分发，建议后续补齐签名与 notarization
          EOF

      - name: Package Windows zip
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = "bin"
          $exe = Join-Path $binDir "${env:APP_NAME}.exe"
          if (!(Test-Path $exe)) {
            Write-Host "Binary not found: $exe"
            Get-ChildItem $binDir -Force
            exit 1
          }
          Compress-Archive -Path $exe -DestinationPath (Join-Path $binDir "${env:APP_NAME}-${{ matrix.artifact_suffix }}.zip") -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}
          path: |
            bin/*.tar.gz
            bin/*.zip
            bin/README-*.txt
          if-no-files-found: error



  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        run: |
          find artifacts -maxdepth 3 -type f | sort

      - name: Create and upload release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}