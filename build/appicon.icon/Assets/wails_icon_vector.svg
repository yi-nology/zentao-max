<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#g)"/>
  </g>
  <!-- Z letterform: 3 connected strokes (top bar + diagonal + bottom bar) -->
  <g fill="#ffffff">
    <!-- Top bar -->
    <rect x="185" y="185" width="654" height="131" rx="6"/>
    <!-- Diagonal stroke (parallelogram from top-right to bottom-left) -->
    <polygon points="657,316 839,316 367,708 185,708"/>
    <!-- Bottom bar -->
    <rect x="185" y="708" width="654" height="131" rx="6"/>
  </g>
</svg>
